# Modified 2026-09-12: fork checks run on changes or manual dispatch; no scheduled issue posting.
name: Validate with hassfest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: home-assistant/actions/hassfest@master
