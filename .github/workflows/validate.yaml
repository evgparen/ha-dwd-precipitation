# Modified 2026-09-12: fork checks run on changes or manual dispatch; no scheduled issue posting.
name: Validate with HACS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
